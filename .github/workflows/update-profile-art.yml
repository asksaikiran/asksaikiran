name: Update profile art

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh profile timestamp
        run: |
          printf '<!-- refreshed: %s -->\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .profile-refresh

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: ".profile-refresh"
